.deep-zone{margin:8px 0 30px;padding:28px;border-radius:22px;background:linear-gradient(155deg,var(--paper),#f4f6ff);border:1px solid #dce3fa;box-shadow:0 15px 45px #3038600b}
.deep-zone>h2{font-size:clamp(23px,3vw,30px);letter-spacing:-1px;margin:10px 0 15px;line-height:1.26}
.deep-zone>h3{font-size:19px;letter-spacing:-.35px;margin:27px 0 7px}
.deep-zone>p{max-width:800px;line-height:1.9}
.deep-tag,.source-mark,.slow-label,.experiment-title span,.compare-kicker{display:inline-block;font-size:10px;font-weight:850;letter-spacing:1.3px;text-transform:uppercase;color:#5b60c5}
.deep-tag{padding:6px 12px;background:#e9ebff;border-radius:99px}
.slow-lesson{margin:21px 0 28px;background:var(--paper);border:1px solid var(--line);border-radius:17px;overflow:hidden}
.slow-label{display:block;padding:14px 20px;background:linear-gradient(90deg,#eef0ff,#f7f7ff)}
.slow-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.slow-steps>div{padding:20px;border-top:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.slow-steps b{display:block;font-size:14px;line-height:1.4;margin:7px 0 4px}
.slow-steps p{font-size:13px;color:var(--muted);line-height:1.75;margin:0}
.slow-num{color:#6975f2;font-weight:900;font-size:13px}
.reveal{background:var(--paper);border:1px solid var(--line);border-radius:13px;margin:18px 0;overflow:hidden}
.reveal summary{cursor:pointer;padding:14px 17px;list-style:none;font-weight:720;font-size:13px;color:var(--text);display:flex;gap:12px;justify-content:space-between;align-items:center}
.reveal summary::-webkit-details-marker{display:none}.reveal summary span{font-size:11px;color:#666ce5;white-space:nowrap}.reveal[open] summary{border-bottom:1px solid var(--line);background:var(--soft)}.reveal-body{padding:16px 20px}.reveal-body p{margin:0 0 8px;line-height:1.85}
.source-teach{border-left:4px solid #7164ef;background:var(--paper);border-radius:0 15px 15px 0;padding:19px 22px;margin:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.source-teach h3{font-size:17px;margin:5px 0 9px}.source-teach p{font-size:14px;line-height:1.82}.source-teach .example{margin:15px 0}.source-mark{color:#5c64d3}
.compare-grid,.concept-trio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:19px 0}
.compare-grid>div,.concept-trio>div{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.compare-grid h3{margin:7px 0;font-size:17px}.compare-grid p{font-size:13px;line-height:1.8;color:var(--muted)}
.compare-grid .math{font-size:14px}.concept-trio{grid-template-columns:repeat(3,minmax(0,1fr))}.concept-trio span{font-weight:850;font-size:12px;color:#5b65ee}.concept-trio b{display:block;margin:7px 0;font-size:13px}.concept-trio p{font-size:12px;color:var(--muted);line-height:1.65;margin:0}
.truth-table{display:grid;gap:9px;margin:17px 0}.truth-table>div{display:grid;grid-template-columns:minmax(155px,38%) 1fr;gap:15px;align-items:center;padding:13px 17px;border:1px solid var(--line);border-radius:13px;background:var(--paper)}.truth-table b{font-size:13px}.truth-table span{font-size:13px;color:var(--muted);line-height:1.65}.truth-table span b{font-size:inherit}
.interactive-experiment{margin:25px 0;padding:23px;background:#101b32;color:#edf3ff;border:1px solid #2f446c;border-radius:20px;overflow:hidden}
.interactive-experiment>p{font-size:13px;color:#b9c4dc;line-height:1.8}.experiment-title span{color:#b3bcff}.experiment-title h3{font-size:20px;letter-spacing:-.4px;margin:4px 0 10px;color:#fff}

<div class="backdrop" id="backdrop"></div><div class="progressbar-top"><span id="readingProgress"></span></div>
<div class="app"><aside class="sidebar" id="sidebar"><div class="logo"><div class="logo-mark">↗</div><div><strong>VectorLab</strong><small>RTU • Matematik I / Türkçe</small></div></div><div class="nav-label">ÖĞRENME YOLCULUĞU</div><nav id="nav"></nav><div class="sidebar-foot"><b>Öğrenme ilerlemen</b><p>Bitirdiğin bölümleri işaretle, kaldığın yerden devam et.</p><div class="progress-track"><div id="sidebarProgress" class="progress-fill"></div></div><span id="sidebarPct" class="pct">%0 tamamlandı</span></div></aside>
<main class="main"><header class="topbar"><button id="menuBtn" class="small-button mobile-toggle" aria-label="Menüyü aç">☰</button><div class="crumb">RTU / <strong>Mathematics I</strong> / Vector Algebra</div><div class="top-actions"><div class="searchwrap"><input id="search" class="searchbox" placeholder="Konu ara..." aria-label="Konu ara"></div><button class="small-button extra" id="resetBtn" title="İlerlemeyi sıfırla">↺ Sıfırla</button><button class="small-button" id="themeBtn" title="Görünümü değiştir">◐ Tema</button></div></header><div class="content" id="content"></div><div class="footer">VectorLab · 13 kaynak PDF'den derlenmiş eğitim sitesi · İnternetsiz çalışır</div></main></div><div class="float-toast" id="toast"></div><script>'use strict';
const chapters=[];
const add=(id,title,sub,level,minutes,source,body,icon='◎')=>chapters.push({id,title,sub,level,minutes,source,body,icon});
const M=(s)=>`<div class="math">${s}</div>`;
const N=(title,html)=>`<div class="callout"><strong>${title}</strong> ${html}</div>`;
const W=(title,html)=>`<div class="callout warning"><strong>${title}</strong> ${html}</div>`;
const G=(title,html)=>`<div class="callout good"><strong>${title}</strong> ${html}</div>`;
const E=(title,question,body,origin='')=>`<div class="example"><div class="tag">ADIM ADIM ÇÖZÜM ${origin?'· '+origin:''}</div><h3>${title}</h3><p>${question}</p>${body}</div>`;
const F=(s)=>`<span class="frac"><span>${s.split('|')[0]}</span><span>${s.split('|')[1]}</span></span>`;
const basicVis=`<div class="visual-panel"><h2>🧭 Canlı vektör laboratuvarı</h2><p>A ve B değerlerini değiştir. Okların nasıl yön değiştirdiğini, toplamın nasıl oluştuğunu gözle.</p><div class="grid-controls"><label class="control">A — x<input id="ax" type="range" min="-5" max="5" step="1" value="3"></label><label class="control">A — y<input id="ay" type="range" min="-5" max="5" step="1" value="2"></label><label class="control">B — x<input id="bx" type="range" min="-5" max="5" step="1" value="-1"></label><label class="control">B — y<input id="by" type="range" min="-5" max="5" step="1" value="3"></label></div><svg viewBox="0 0 640 360" id="vectorSVG" role="img" aria-label="İki vektör ve toplamlarının koordinat düzlemindeki görünümü"></svg><div class="legend"><span><span class="dot" style="background:#7dd3fc"></span> A vektörü</span><span><span class="dot" style="background:#ffbf88"></span> B vektörü</span><span><span class="dot" style="background:#b5f39f"></span> A+B</span></div><div class="visual-result" id="vectorResult"></div></div>`;
add('start','Başlangıç','Bu konular birbirine nasıl bağlanıyor?','Yol haritası',7,'13 PDF / Krista King + RTU',`
<div class="hero"><div class="eyebrow">TÜRKÇE • SIFIRDAN SINAV SEVİYESİNE</div><h1>Vektörleri <em>ezberlemeden</em><br>gerçekten öğren.</h1><p>Görsel, adım adım ilerleyen yeni anlatımla iki kaynak grubunu birleştirdim: Krista King’in sezgisel açıklamaları + RTU ders notlarının tanımları ve sınav tarzı alıştırmaları. Her konu için önce <b>mantığı</b>, sonra <b>formülü</b>, ardından <b>çözümü</b> göreceksin.</p><div class="hero-actions"><button class="primary-button" onclick="go('vectors')">Derse başla →</button><button class="ghost-button" onclick="go('exam')">Sınav modu ↗</button></div></div>
<div class="metrics"><div class="metric"><b>12</b><span>Konu anlatımı</span></div><div class="metric"><b>13</b><span>İncelenen PDF</span></div><div class="metric"><b id="homeQuestionCount">—</b><span>Kontrol sorusu</span></div></div>
<div class="block"><h2>Önce büyük resmi görelim</h2><p>Matematikte bir konuyu anlamak için formülün neyi ölçtüğünü bilmek gerekir. Bu derslerde tüm konular üç soruya cevap verir:</p><div class="two-cols"><div>${M('<b>1.</b> Vektör nerede ve ne kadar uzun?<br><span class="sign">(x,y,z)</span> · uzunluk · birim vektör')}</div><div>${M('<b>2.</b> Birkaç vektör birlikte ne üretir?<br><span class="sign">Toplama</span> · span · independence')}</div></div>${M('<b>3.</b> İki veya üç vektörün ilişkisi nedir?<br><span class="sign">Dot</span> → açı & diklik &nbsp; / &nbsp; <span class="sign">Cross</span> → dik vektör & alan &nbsp; / &nbsp; <span class="sign">Triple</span> → hacim')}
${G('Önemli bağlantı:','Linearly independent vektörler yeni yön kazandırır; dot product yönlerin birbirine ne kadar baktığını, cross product bu yönlere dik olan vektörü bulur.')}</div>
${basicVis}
<h2 class="section-title">Öğrenme rotan</h2><p class="section-sub">Konu kartına basarak doğrudan o derse geçebilirsin.</p><div class="cards" id="homeCards"></div>
<div class="block"><h2>İki kaynak neden birlikte?</h2><div class="two-cols"><div>${N('Krista King notları:','Konuyu örnek ve sezgiyle tanıtıyor: vektör, span, independence, dot, açı ve cross.')}</div><div>${N('RTU ders notları:','Geometrik kurallar, izdüşüm, determinant, 3B koordinatlar, triple product ve cevaplı sınav türü sorular ekliyor.')}</div></div><p>Site, PDF sayfalarını kopyalamak yerine içerikleri bir öğrenme sırasına göre yeniden açıklıyor. Örneklerde hangi kaynaktan yararlanıldığı belirtilir.</p></div>
`,'✦');
add('vectors','Vektör nedir?','Okun uzunluğu ve yönü aynı nesnenin iki yüzüdür.','Temel',17,'Krista: 01 Vectors s.1–8 · RTU: 2_01 s.1 · 2_02 s.1',`
<div class="block"><h2>1. Vektör bir sayı değil, yönlü hareket</h2><p>Birine “3 adım yürü” dersen nereye gideceği belli olmaz. “3 adım doğuya yürü” dersen hem <b>uzunluğu</b> hem de <b>yönü</b> bilirsin. İşte bu, vektörün özüdür.</p>${M('<b>v</b> = (3, 4) &nbsp; → &nbsp; 3 birim sağa, 4 birim yukarı')}
<ul><li><b>Magnitude / modulus / norm</b> = vektörün uzunluğu.</li><li><b>Initial point / tail</b> = başlangıç; <b>terminal point / head</b> = bitiş.</li><li><b>R²</b> = 2 koordinatlı vektörler; <b>R³</b> = 3 koordinatlı vektörler.</li><li><b>Scalar</b> = yalnızca sayı (−2, 3.5, 7); <b>vector</b> = bileşenlerden oluşan yönlü nesne.</li></ul>${N('Vektör yer değiştirebilir:','Bu dersin serbest vektörlerinde oku düzlemde başka yere taşıman vektörü değiştirmez; yön ve uzunluk aynı kalır.')}</div>
<div class="block"><h2>2. Satır, sütun ve koordinat yazımı</h2><p>Şu üç gösterim aynı koordinat bilgisini taşır. Hesaplarda satır / sütun gösterimi önem kazanır.</p>${M('v = (3,4) &nbsp;&nbsp; = &nbsp; [3 &nbsp; 4] &nbsp;&nbsp; veya &nbsp;&nbsp; <span style="display:inline-grid;vertical-align:middle;line-height:1.2;border-left:2px solid;border-right:2px solid;padding:0 8px">3<br>4</span>')}
${W('Sık hata:','(3,4) bir noktanın koordinatı da olabilir. O(0,0) noktasından (3,4) noktasına giden oku düşündüğünde bunu konum vektörü olarak kullanırsın.')}</div>
<div class="block"><h2>3. Uzunluk nasıl hesaplanır?</h2><p>Yatay ve dikey hareket bir dik üçgen kurar. Pisagor teoremini kullanırsın:</p>${M('|v| = √(x² + y²) &nbsp;&nbsp; (R²)<br>|v| = √(x² + y² + z²) &nbsp;&nbsp; (R³)')}
${E('Vektörün uzunluğu','v = (3,4) olsun. Ne kadar uzun?',`<ol class="step-list"><li>Koordinatların karelerini al: <b>3² = 9, 4² = 16.</b></li><li>Topla: <b>9 + 16 = 25.</b></li><li>Karekök al: <b>|v| = √25 = 5.</b></li></ol>${G('Cevap:','5 birim. Koordinatlar 3 ve 4 olsa da uzunluk 3 + 4 = 7 değildir.')}`)}
${E('Üç boyutta uzunluk','v = (−3,6,−2)',`${M('|v| = √[(−3)² + 6² + (−2)²] = √(9+36+4) = <span class="result">7</span>')}`,'RTU 2_02, Alıştırma 1')}
</div><div class="block"><h2>4. Aynı yön, zıt yön, doğrusal olma</h2><p><b>Equal vectors:</b> aynı büyüklük, aynı yön. <b>Opposite:</b> aynı büyüklük, zıt yön. <b>Collinear:</b> aynı doğruya paralel yönler (aynı veya zıt olabilir).</p>${M('a = (2,4), b = (6,12) &nbsp; ⇒ &nbsp; b = 3a &nbsp; → &nbsp; collinear')}
${M('a = (2,4), c = (−2,−4) &nbsp; ⇒ &nbsp; c = −a &nbsp; → &nbsp; opposite')}
${W('Sıfır vektörü:','(0,0) veya (0,0,0) uzunluğu 0’dır, yönü tanımlı değildir. Sıfır vektörü içeren herhangi bir vektör kümesi linearly dependent olur.')}</div>
`,'↗');
add('operations','Toplama, çıkarma, skaler','Hem koordinatla hem de çizerek işlem yap.','Temel',20,'Krista: 02 Vector operations s.1–12 · RTU: 2_01 s.1–2 · 2_02 s.1',`
<div class="block"><h2>1. Toplama: aynı konumdaki elemanları topla</h2>${M('a = (3,4), &nbsp; b = (−1,2)<br>a+b = (3+(−1), 4+2) = <span class="result">(2,6)</span>')}
<p>Düşün: 3 sağa ve 4 yukarı gittin; sonra 1 sola ve 2 yukarı. Net hareket: 2 sağa, 6 yukarı.</p><h3>Üçgen (triangle) yöntemi</h3><p>İkinci okun <b>kuyruğunu birinci okun ucuna</b> yerleştir. Başlangıçtan en son okun ucuna çizdiğin ok toplamdır: <b>AB + BC = AC</b>.</p><h3>Paralelkenar (parallelogram) yöntemi</h3><p>İki okun kuyrukları aynı yerde olsun (OA ve OB). Bunları iki kenar kabul ederek paralelkenarı tamamla. Başlangıçtan karşı köşeye çizilen köşegen toplamdır: <b>OA + OB = OC</b>.</p>${G('İki yöntem, bir sonuç:','Üçgen yönteminde uç uca ekliyorsun; paralelkenarda iki oku aynı başlangıçtan çiziyorsun. İkisi de koordinat olarak aynı a+b sonucunu verir.')}</div>
${basicVis.replaceAll('id="ax"','id="ax2"').replaceAll('id="ay"','id="ay2"').replaceAll('id="bx"','id="bx2"').replaceAll('id="by"','id="by2"').replaceAll('id="vectorSVG"','id="vectorSVG2"').replaceAll('id="vectorResult"','id="vectorResult2"')}
<div class="block"><h2>2. Çıkarma: ikinci vektörün tersini ekle</h2>${M('a − b = a + (−b)')}
${E('Çıkarma','a = (3,4), b = (−1,2)',`${M('a − b = (3−(−1), 4−2) = <span class="result">(4,2)</span>')}`)}
${N('Geometrik fark:','İki ok aynı başlangıçtan çizildiyse <b>b’den a’ya</b> uzanan ok a−b’dir. Tersi yön a’dan b’ye uzanır ve b−a eder.')}</div>
<div class="block"><h2>3. Skaler ile çarpma: her bileşeni çarp</h2>${M('k(a₁,a₂,a₃) = (ka₁,ka₂,ka₃)')}${E('Parantezli işlem','a = (2,−1,3), b = (1,4,−2). 2a−3b kaç?',`<ol class="step-list"><li>2a = (4,−2,6)</li><li>3b = (3,12,−6)</li><li>2a−3b = (4−3,−2−12,6−(−6))</li></ol>${M('<span class="result">(1, −14, 12)</span>')}`)}
${W('İşaret uyarısı:','Negatif bir vektörü çıkarırken iki eksi artıya dönüşür. Örneğin 5−(−2) = 7. Bir de k negatifse yön tersine döner: −a.')}</div>
`,'＋');
add('coordinates','Noktalardan vektör bul','A’dan B’ye giderken neden B−A yapıyoruz?','Temel',17,'RTU: 2_02 s.1–3 · Krista: 01 Vectors s.1–8',`
<div class="block"><h2>1. Başlangıç ve bitiş noktası farklıdır</h2><p>Bir soru sana A ve B noktalarını verirse vektörün koordinatları doğrudan B değildir. <b>Gidiş − çıkış</b> yaparsın.</p>${M('A(x₁,y₁,z₁), B(x₂,y₂,z₂)<br><b>AB⃗ = (x₂−x₁, y₂−y₁, z₂−z₁)</b>')}
${E('RTU örneği','A(4,−2,5), B(1,4,3)',`<ol class="step-list"><li>B−A hesapla: (1−4, 4−(−2), 3−5).</li><li>AB⃗ = (−3,6,−2).</li><li>Uzunluk √(9+36+4)=<b>7</b>.</li><li>Birim vektör AB⃗/7 = <b>(−3/7, 6/7, −2/7)</b>.</li></ol>`,'RTU 2_02, Alıştırma 1')}
${W('Yön kritik:','AB⃗ = B−A; BA⃗ = A−B = −AB⃗. Sıra değişirse tüm işaretler tersine döner.')}</div>
<div class="block"><h2>2. Paralelkenarda bilinmeyen D köşesi</h2><p>ABCD sıralı bir paralelkenarsa <b>AB⃗ = DC⃗</b> ve köşegenlerin orta noktası aynıdır.</p>${M('D = A + C − B &nbsp;&nbsp;&nbsp; M = (A + C)/2')}
${E('RTU köşe sorusu','A(2,−3,4), B(3,1,−1), C(2,−1,2). D ve köşegen kesişimi M?',`<ol class="step-list"><li>D = A + C − B: (2+2−3, −3+(−1)−1, 4+2−(−1))</li><li><b>D = (1,−5,7).</b></li><li>M = (A+C)/2 = ((2+2)/2,(−3−1)/2,(4+2)/2).</li><li><b>M = (2,−2,3).</b></li></ol>`,'RTU 2_02, Alıştırma 7')}
</div><div class="block"><h2>3. 3B koordinat neyi temsil eder?</h2><p>(2, −1, 3) koordinatındaki ilk iki sayı düzlemdeki yatay ve dikey hareket; üçüncü sayı <b>z yönündeki</b> yer değiştirmedir. Üç boyutlu bir vektörün bileşenleri ayrı ayrı ölçülür; toplarken de her eksen kendi içinde hesaplanır.</p>${G('Hatırla:','3B vektörü 2B’ye indirgemeye çalışma. Koordinat sayısı kaçsa normun içinde o kadar kare terimi vardır.')}</div>
`,'⌖');
add('unit','Birim vektör ve baz','Yönü koruyup uzunluğu 1 yapmak.','Temel',19,'Krista: 03 Unit vectors and basis vectors s.1–8 · RTU: 2_02 s.1–3',`
<div class="block"><h2>1. Birim vektör (unit vector)</h2><p>Bir ok uzunluğu 5 olsa da sadece <b>hangi tarafa baktığını</b> öğrenmek isteyebiliriz. O zaman vektörü kendi uzunluğuna böleriz.</p>${M('<b>u = v / |v|</b> &nbsp; (v ≠ 0)')}
${E('Yönü aynı, uzunluğu 1','v = (3,4)',`<ol class="step-list"><li>Uzunluğu bul: |v|=√(9+16)=5.</li><li>Her bileşeni 5’e böl: u=(3/5,4/5).</li><li>Kontrol: √[(3/5)²+(4/5)²] = 1.</li></ol>${M('<span class="result">u = (0.6, 0.8)</span>')}`)}
${W('Sıfır vektörü:','v=(0,0) ise |v|=0 olur, 0’a bölünemez. Sıfır vektörünün birim yön vektörü yoktur.')}</div>
<div class="block"><h2>2. Baz vektörleri i, j, k</h2><p>Her eksenin bir birim oku bulunur. Diğer tüm koordinat vektörlerini bunların katları ve toplamı olarak yazabiliriz.</p>${M('R²: i = (1,0), j = (0,1)<br>R³: i = (1,0,0), j = (0,1,0), k = (0,0,1)')}
${M('(3,−2,5) = 3i − 2j + 5k')}
<p>Yani 3 tane x-yönü ok, −2 tane y-yönü ok, 5 tane z-yönü ok bir araya gelince (3,−2,5) oluşur.</p></div>
<div class="block"><h2>3. Direction cosines — eksenlerle açı</h2><p>RTU notlarında α, β, γ vektörün sırasıyla x, y, z eksenlerinin <b>pozitif yönleriyle</b> yaptığı açılardır. Bu açıların kosinüsleri birim vektörün bileşenleridir.</p>${M('cos α = aₓ/|a| &nbsp; ; &nbsp; cos β = aᵧ/|a| &nbsp; ; &nbsp; cos γ = a𝓏/|a|')}${M('cos²α + cos²β + cos²γ = 1')}
${E('RTU direction cosine','|a|=4, α=60°, β=120°. a’nın tüm koordinatlarını bul.',`<ol class="step-list"><li>aₓ=4cos60°=2</li><li>aᵧ=4cos120°=−2</li><li>cos²γ=1−(1/2)²−(−1/2)²=1/2</li><li>a𝓏=4(±1/√2)=±2√2</li></ol>${M('a = <span class="result">(2, −2, ±2√2)</span>')}${N('Neden iki sonuç?','Z ekseniyle yaptığı açının keskin mi geniş mi olduğu verilmediğinden z bileşeni hem pozitif hem negatif olabilir.')}`,'RTU 2_02, Alıştırma 4')}
</div>
`,'⊙');
add('projection','Projeksiyon / izdüşüm','Bir vektörün başka bir yönde ne kadarı var?','Orta',20,'RTU: 2_01 s.2 · 2_03 s.1–2',`
<div class="block"><h2>1. Gölge benzetmesi</h2><p>Bir vektörü bir eksene paralel ışıkla yansıttığını düşün. Bu vektörün o eksen üzerindeki <b>işaretli gölge uzunluğu</b> skaler projeksiyonudur.</p>${M('scalar projection of a onto b = |a| cosθ = (a·b)/|b|')}
<p>Başka bir deyişle önce dot product alıyorsun, sonra üstüne yansıtılan vektörün (<b>b</b>) uzunluğuna bölüyorsun. θ, iki vektör arasındaki açıdır.</p>
${E('Önce skaler projeksiyon','a=(3,4), b=(1,0). a’nın b doğrultusundaki izdüşümü?',`<ol class="step-list"><li>a·b = 3·1 + 4·0 = 3</li><li>|b| = √(1²+0²) = 1</li><li>Skaler projeksiyon = 3/1 = <b>3</b>.</li></ol>${G('Anlamı:','a’nın x eksenindeki etkisi 3 birim; y bileşeni bu projeksiyona katkıda bulunmaz.')}`)}
</div><div class="block"><h2>2. Scalar ve vector projection farkı</h2><p>Skaler projeksiyon bir sayıdır, eksi bile olabilir. Vektörel projeksiyon ise b doğrultusunda bir <b>vektördür</b>.</p>${M('projᵇ(a) &nbsp; (skaler) = (a·b)/|b|<br>Projᵇ(a) &nbsp; (vektör) = [(a·b)/|b|²] b')}
${E('Vektörel projeksiyon','a=(2,3), b=(4,0)',`<ol class="step-list"><li>a·b=8</li><li>|b|²=16</li><li>(8/16)(4,0) = <b>(2,0)</b>.</li></ol>${M('Projᵇ(a) = <span class="result">(2,0)</span>')}`)}
${W('En sık hata:','Skaler projeksiyon soruluyorsa tek sayı yaz; vector projection soruluyorsa vektör yaz. b=(0,0) olursa bu formüller tanımsızdır.')}</div>
<div class="block"><h2>3. RTU tipinde noktalardan izdüşüm</h2>${E('AB’nin CD doğrultusundaki skaler projeksiyonu','A(−1,2,1), B(2,6,−3), C(0,2,2), D(4,−2,0)',`<ol class="step-list"><li>AB⃗ = B−A = (3,4,−4)</li><li>CD⃗ = D−C = (4,−4,−2)</li><li>AB·CD = 3·4 + 4·(−4) + (−4)·(−2) = 4</li><li>|CD| = √(16+16+4) = 6</li><li>Projeksiyon = 4/6 = <b>2/3</b>.</li></ol>`,'RTU 2_03, Alıştırma 6')}
</div>
`,'◫');
add('span','Linear combination & span','Bir vektör kümesi hangi noktalara ulaşabilir?','Orta',21,'Krista: 04 Linear combinations and span s.1–5 · RTU: 2_02 s.2',`
<div class="block"><h2>1. Linear combination = katlarını al ve topla</h2><p>c₁a + c₂b ifadesindeki c₁, c₂ yalnızca sayıdır. Vektörlerin katlarını ekleyerek yeni vektörler üretirsin. Buna <b>doğrusal birleşim</b> (linear combination) denir.</p>${M('a=(1,0), b=(0,1)<br>3a + 2b = 3(1,0)+2(0,1) = <span class="result">(3,2)</span>')}
<p>İstersen −7a+4b yaparsın, istersen 0.3a−12b. Çarpanlar (scalars) herhangi bir reel sayı olabilir.</p></div>
<div class="block"><h2>2. Span nedir?</h2><p><b>Span(a,b)</b>, a ve b’nin <i>tüm olası</i> doğrusal birleşimleriyle ulaşabileceğin nokta kümesidir. Yani tek bir toplam değil, sonsuz farklı katsayı kullanınca oluşan bütün sonuçlar.</p><div class="two-cols"><div class="example"><div class="tag">AYNI DOĞRULTU</div><h3>a=(1,1), b=(2,2)</h3><p>Her birleşim (t,t) şeklindedir. Yalnızca y=x doğrusu üzerinde hareket edersin. <b>Span R² değildir.</b></p></div><div class="example"><div class="tag">İKİ FARKLI YÖN</div><h3>a=(1,0), b=(0,1)</h3><p>Her (x,y) için xa+yb=(x,y). Düzlemde istediğin noktaya gidersin. <b>Span R².</b></p></div></div>
${N('Büyük fark:','Her vektör kümesinin bir span’i vardır. Ama her küme <b>R²’nin veya R³’ün tamamını</b> span etmez.')}</div>
<div class="block"><h2>3. Span, boyut ve bağımsızlık ilişkisi</h2><table class="mini-table"><thead><tr><th>Küme</th><th>Hangi uzayı span eder?</th></tr></thead><tbody><tr><td>R²’de 1 sıfır olmayan vektör</td><td>Yalnızca bir doğru</td></tr><tr><td>R²’de bağımsız 2 vektör</td><td>R²’nin tamamı</td></tr><tr><td>R³’te bağımsız 2 vektör</td><td>Orijinden geçen bir düzlem</td></tr><tr><td>R³’te bağımsız 3 vektör</td><td>R³’ün tamamı</td></tr><tr><td>Sadece sıfır vektörü</td><td>Yalnızca başlangıç noktası</td></tr></tbody></table>
${E('Hedefe ulaşabilir miyiz?','a=(1,0), b=(1,1). Hedef v=(5,3). c₁a+c₂b=v denklemini kur.',`<ol class="step-list"><li>c₁(1,0)+c₂(1,1)=(c₁+c₂,c₂)</li><li>c₁+c₂=5 ve c₂=3</li><li>c₁=2</li></ol>${M('<span class="result">2a + 3b = (5,3)</span>')}`)}
${W('Yanılgı:','"3 vektör varsa R³ span eder" yanlış. Üç vektör aynı düzlemdeyse R³’e yayılamaz. Aynı sayıda olmak yetmez; bağımsız olmaları gerekir.')}</div>
`,'∞');
add('li2','Linear independence — R²','İki ok gerçekten iki farklı yön mü veriyor?','Orta',24,'Krista: 05 Linear independence in two dimensions s.1–10 · RTU: 2_02 s.2',`
<div class="block"><h2>1. Independent ne demek?</h2><p>İki vektörün birisi diğerinin katıysa ikinci ok sana <b>yeni bir yön</b> sağlamaz. O zaman <b>linearly dependent (LD)</b> deriz. Biri diğerinin katı değilse iki bağımsız yön vardır: <b>linearly independent (LI)</b>.</p><div class="two-cols"><div>${M('a=(2,4), b=(3,6)<br>b=1.5a → <span class="sign">DEPENDENT</span>')}</div><div>${M('a=(2,4), b=(3,5)<br>Kat değil → <span class="result">INDEPENDENT</span>')}</div></div>
${N('Görsel düşün:','Dependent iki vektör aynı doğru boyunca hareket eder. Independent iki vektör farklı doğrultular açar, bir araya gelerek R²’yi span eder.')}</div>
<div class="block"><h2>2. En hızlı test: 2×2 determinant</h2><p>Vektörlerini sütunlara yerleştir. 2×2 matrisin determinantı <b>ad−bc</b> şeklindedir.</p>${M('a=(a₁,a₂), b=(b₁,b₂)<br>det [ a₁ &nbsp; b₁ ; &nbsp; a₂ &nbsp; b₂ ] = a₁b₂ − a₂b₁')}
${M('det ≠ 0 → <span class="result">INDEPENDENT</span><br>det = 0 → <span class="sign">DEPENDENT</span>')}
${E('Determinant ile çöz','a=(2,4), b=(3,5)',`<ol class="step-list"><li>Matrisin sütunlarını vektörlerden kur: [2 3; 4 5].</li><li>Determinant: 2·5−3·4=10−12=−2.</li><li>−2 ≠ 0 olduğu için <b>LINEARLY INDEPENDENT.</b></li></ol>`)}
</div>
<div class="visual-panel"><h2>🧪 Canlı independence testi (R²)</h2><p>Vektörleri değiştir. Determinant sıfır olunca aynı doğruya düştüklerini göreceksin.</p><div class="grid-controls"><label class="control">aₓ<input id="lax" type="number" min="-9" max="9" value="2"></label><label class="control">aᵧ<input id="lay" type="number" min="-9" max="9" value="4"></label><label class="control">bₓ<input id="lbx" type="number" min="-9" max="9" value="3"></label><label class="control">bᵧ<input id="lby" type="number" min="-9" max="9" value="6"></label></div><svg viewBox="0 0 640 320" id="liSVG" role="img" aria-label="İki vektör ve doğrusal bağımsızlık görselleştirmesi"></svg><div class="visual-result" id="liResult"></div></div>
<div class="block"><h2>3. Gerçek tanım: sıfır vektör denklemi</h2><p>Her büyüklükte vektör kümesi için çalışan güvenilir yöntem:</p>${M('c₁a + c₂b = 0')}
<p><b>Yalnızca</b> c₁=c₂=0 çözümü varsa LI. Sıfırdan farklı katsayılarla da toplam 0 elde edilebiliyorsa LD.</p>${E('Sistem kur','a=(1,2), b=(2,4)',`<ol class="step-list"><li>c₁(1,2)+c₂(2,4)=(0,0)</li><li>c₁+2c₂=0, 2c₁+4c₂=0</li><li>c₁=−2, c₂=1 seçebilirsin; katsayılar sıfır değil ama toplam sıfır.</li></ol>${M('<span class="sign">DEPENDENT</span>')}`)}
${W('Kritik boyut kuralı:','R²’de 3 veya daha fazla vektör varsa küme her zaman LD’dir. Ancak 1 veya 2 vektör varsa otomatik olarak LI diyemezsin; sıfır vektörü ve kat olma durumunu kontrol et.')}</div>
`,'≠');
add('li3','Linear independence — R³','Üçüncü vektör yeni bir yön ekliyor mu?','Orta',29,'Krista: 06 Linear independence in three dimensions s.1–5 · RTU: 2_02 s.2–3',`
<div class="block"><h2>1. İki boyuttan üç boyuta geçiş</h2><p>R³’te bir bağımsız vektör bir doğru, iki bağımsız vektör bir düzlem, üç bağımsız vektör bütün 3B uzayı oluşturabilir. Üçüncü ok ilk ikisinin oluşturduğu düzlemde kalırsa <b>dependent</b> olur.</p>${M('c₁a+c₂b+c₃c=0<br>Tek çözüm (0,0,0) → LI<br>Sıfırdan farklı çözüm de var → LD')}
${N('Hızlı kural:','R³’te 4 vektör varsa kesin LD. Ama 3 vektör varsa determinant veya Gauss eliminasyonu gerekir.')}</div>
<div class="block"><h2>2. 3×3 determinantla karar ver</h2><p>Sınav için çoğu zaman en hızlı yol 3×3 determinanttır. Vektörleri sütun veya satır koyabilirsin; determinantın sıfır olup olmaması değişmez.</p>${M('A = [a₁ b₁ c₁; a₂ b₂ c₂; a₃ b₃ c₃]')}
${M('det(A) = a₁(b₂c₃−b₃c₂) − b₁(a₂c₃−a₃c₂) + c₁(a₂b₃−a₃b₂)')}
${E('RTU cevaplı bağımsızlık sorusu','a=(5,2,1), b=(1,−1,2), c=(0,1,−3). Independent mı?',`<ol class="step-list"><li>Satır matrisi oluştur: [5 2 1; 1 −1 2; 0 1 −3].</li><li>Birinci satırdan aç: 5[(−1)(−3)−(2)(1)] − 2[(1)(−3)−(2)(0)] + 1[(1)(1)−(−1)(0)].</li><li>= 5·1 − 2·(−3)+1·1 = 12.</li><li>12 ≠ 0 → <b>LINEARLY INDEPENDENT.</b></li></ol>`,'RTU 2_02, Alıştırma 8(a)')}
</div>
<div class="block"><h2>3. Dependent çıkarsa vektörü diğerleriyle yaz</h2>${E('RTU dependent örneği','a=(3,−1,2), b=(2,0,−1), c=(1,−3,10)',`<ol class="step-list"><li>Bu üç vektörün determinantı 0 çıkar → LD.</li><li>c = sa + tb olacak şekilde eşitlik kur.</li><li>Y ekseninden −s=−3 → s=3.</li><li>X ekseninden 3·3+2t=1 → t=−4.</li><li>Z kontrolü: 3·2+(−4)(−1)=6+4=10. Doğru!</li></ol>${M('<span class="result">c = 3a − 4b</span>')}`,'RTU 2_02, Alıştırma 8(b)')}
</div><div class="block"><h2>4. Gauss eliminasyonu: determinant olmadan</h2><p>Vektörleri sütunlara koyup satır işlemleri uygularsın. Her sütunda pivot kalırsa LI; pivot eksikse LD.</p>${E('Krista King’deki örnek','v₁=(1,2,3), v₂=(0,1,4), v₃=(2,−3,0)',`${M('[ 1 &nbsp; 0 &nbsp; 2 ]<br>[ 2 &nbsp; 1 &nbsp; −3 ]<br>[ 3 &nbsp; 4 &nbsp; 0 ]')}<ol class="step-list"><li>R₂ ← R₂ − 2R₁ ⇒ [0,1,−7]</li><li>R₃ ← R₃ − 3R₁ ⇒ [0,4,−6]</li><li>R₃ ← R₃ − 4R₂ ⇒ [0,0,22]</li><li>Üç pivot da sıfır değil. Matris birim matrise indirgenebilir → <b>LI.</b></li></ol>`,'Krista: LI in three dimensions, s.2–3')}
${W('Ayrımı öğren:','2 vektör için “birbirinin katı mı?” testi yeterli. Ama 3 vektörde yalnızca ikili kat kontrolü yeterli değildir: c=a+b olsa bile hiçbir ikili birbirinin katı olmayabilir, yine de üçlü LD’dir.')}</div>
`,'▥');
add('dot','Dot product / skaler çarpım','Tek sayı üreten çarpım ve temel özellikleri.','Önemli',25,'Krista: 01 Dot products s.1–7 · RTU: 2_03 s.1–3',`
<div class="block"><h2>1. Dot product neden tek sayı çıkar?</h2><p>İki vektörün eşleşen koordinatlarını çarpıp toplarsın. Bu hesap yönlü yeni bir ok üretmez; <b>tek bir sayı (scalar)</b> üretir. İki farklı hesaplama formülü vardır ama aynı işlemi anlatırlar.</p>${M('<b>a · b = a₁b₁ + a₂b₂ + a₃b₃</b>')}
${E('Koordinat formülü','a=(2,3,4), b=(5,−2,1)',`<ol class="step-list"><li>İlkleri çarp: 2·5=10</li><li>İkincileri çarp: 3·(−2)=−6</li><li>Üçüncüleri çarp: 4·1=4</li><li>Topla: 10−6+4=<b>8</b>.</li></ol>${M('a · b = <span class="result">8</span>')}`)}
</div><div class="block"><h2>2. Aynı dot product'ın geometrik formülü</h2>${M('<b>a · b = |a| |b| cosθ</b>')}
<p>Uzunluklar ve aralarındaki açı verildiyse bunu kullanırsın. Örneğin |a|=4, |b|=5, θ=60° ise:</p>${M('a·b=4·5·cos60° = 20·(1/2) = <span class="result">10</span>')}
${G('Neden iki formül?','Birincisi bileşenlerle hesaplar; ikincisi aynı sayının uzunluk ve açıyla ilişkisini gösterir. Koordinat sorusunda ilkini, açı/uzunluk sorusunda ikincisini kullanırsın.')}</div>
<div class="block"><h2>3. Parantezli dot product: çözme sırası</h2>${E('Önceki örneğin — eksiksiz çözüm','x=(−4,−2,7), y=(6,−1,−10), z=(3,−2,0). 3x·(−2y−z)',`<ol class="step-list"><li>3x = (−12,−6,21)</li><li>−2y = (−12,2,20)</li><li>−z = (−3,2,0)</li><li>−2y−z = (−15,4,20)</li><li>Dot = (−12)(−15)+(−6)(4)+21(20) = 180−24+420</li></ol>${M('<span class="result">576</span>')}`)}
${N('Dağıtma alternatifi:','3x·(−2y−z) = −6(x·y) − 3(x·z). Dağılım özelliği aynı sonuca ulaşır. Koordinat sayıları karışıksa önce parantezi çözmek genellikle daha güvenlidir.')}</div>
<div class="block"><h2>4. Ortogonallik ve dot product işareti</h2><table class="mini-table"><thead><tr><th>Durum</th><th>Anlam</th></tr></thead><tbody><tr><td>a·b &gt; 0</td><td>İki sıfır olmayan vektör arasında dar açı (&lt;90°)</td></tr><tr><td>a·b = 0</td><td>Sıfır olmayan iki vektör diktir (90°)</td></tr><tr><td>a·b &lt; 0</td><td>Geniş açı (&gt;90°)</td></tr><tr><td>a·a</td><td>|a|²: uzunluğun karesi</td></tr></tbody></table>
${E('Dik mi?','a=(2,−1,3), b=(1,−1,−1)',`${M('a·b = 2·1 + (−1)(−1) + 3(−1) = 2+1−3 = <span class="result">0</span>')}${G('Sonuç:','İki vektör sıfır değil ve dot = 0, o hâlde diktirler.')}`)}
${W('Yanılgı:','a·b=0 her zaman LI anlamına gelmez: sıfır vektörü de herkesle dot=0 yapar. İki vektör de sıfırdan farklıysa diklikleri onların LI olduğunu garanti eder.')}</div>
<div class="block"><h2>5. RTU bağlantısı: mekanik iş</h2><p>Kuvvet F ve yer değiştirme s verildiğinde yapılan iş: <b>W = F·s</b>.</p>${E('RTU work sorusu','F=(2,−4,5), A(3,−1,2), B(5,−2,3)',`<ol class="step-list"><li>s=AB⃗=B−A=(2,−1,1)</li><li>W=F·s=2·2+(−4)(−1)+5·1</li><li><b>W=13</b> (birim verilmediyse sayısal sonuç).</li></ol>`,'RTU 2_03, Alıştırma 5')}
</div>
`,'·');
add('angle','İki vektör arasındaki açı','Arccos nerede ve neden kullanılır?','Önemli',25,'Krista: 04 Angle between vectors s.1–5 · RTU: 2_03 s.1–3',`
<div class="block"><h2>1. Dot product formülünü açı için düzenle</h2>${M('a·b = |a||b|cosθ')}
<p>Çözmek istediğin şey açı olduğuna göre cosθ'yı yalnız bırak:</p>${M('cosθ = (a·b) / (|a||b|)')}
<p><b>Son adım:</b> θ = arccos(bulunan değer), yani hesap makinesindeki cos⁻¹ tuşu. İki vektörün sıfırdan farklı olması gerekir.</p>
${E('Açı bulma — dört adım','a=(1,0), b=(1,1)',`<ol class="step-list"><li>Dot product: 1·1+0·1=<b>1</b></li><li>|a|=√1=1</li><li>|b|=√(1+1)=√2</li><li>cosθ=1/√2=√2/2 → θ=45°</li></ol>${M('θ = <span class="result">45°</span>')}`)}</div>
<div class="block"><h2>2. Küsuratlı açı: tam değerle kalabilir</h2>${E('Krista notundan örnek','u=(2,−1), v=(−1,4)',`<ol class="step-list"><li>u·v=2(−1)+(−1)4=−6.</li><li>|u|=√5 ve |v|=√17.</li><li>cosθ = −6/(√5·√17) = −6/√85.</li><li>θ = arccos(−6/√85) ≈ <b>130.60°</b>.</li></ol>${W('Hesap makinesi yoksa:','Soruda yaklaşık derece istenmiyorsa θ = arccos(−6/√85) şeklinde <b>tam ve doğru</b> ifade bırakabilirsin. Yaklaşık derece gerekiyorsa hesap makinesi gerekir veya özel açı bilmen gerekir.')}`,'Krista: Angle between vectors, s.1–2')}
</div><div class="block"><h2>3. Açı sınıflandırma</h2><p>İki sıfır olmayan vektörün arasındaki açı 0° ile 180° arasındadır. Cosθ'nın işareti dot product'ın işaretidir.</p>${M('a·b > 0 → 0° ≤ θ &lt; 90°<br>a·b = 0 → θ = 90°<br>a·b &lt; 0 → 90° &lt; θ ≤ 180°')}
${E('Açı hesaplamadan karar ver','a=(−1,2), b=(3,1)',`${M('a·b=(−1)·3+2·1=−1')}${G('Cevap:','Dot negatiftir; vektörlerin arası geniş açıdır (90°–180°). Derece bulmana gerek yok.')}`)}
${W('İki farklı açı:','İki vektörün arası soruluyorsa ikisini aynı başlangıçtan çizmiş gibi düşün. Açı yönünü karıştırırsan 180°−θ hatası yapabilirsin.')}</div>
<div class="visual-panel"><h2>📐 Canlı dot & açı hesaplayıcısı</h2><p>Bileşenleri yaz, dot product ve açının nasıl bağlandığını gör.</p><div class="grid-controls"><label class="control">a = (x, y) <input id="angleA" value="2,-1" spellcheck="false"></label><label class="control">b = (x, y) <input id="angleB" value="-1,4" spellcheck="false"></label></div><div class="visual-result" id="angleResult"></div></div>
`,'∠');
add('cross','Cross product / vektörel çarpım','Üç boyutta iki oka dik yeni bir ok üret.','Önemli',30,'Krista: 06 Cross products s.1–7 · RTU: 2_04 s.1–4',`
<div class="block"><h2>1. Dot product ile cross product aynı değil!</h2><div class="two-cols"><div>${M('a · b = <span class="result">sayı</span>')}<p>Aradaki açı, diklik, iş, skaler izdüşüm.</p></div><div>${M('a × b = <span class="sign">vektör</span>')}<p>Her iki oka dik yön, paralelkenar alanı.</p></div></div>
<p>Bu derste 3B standart cross product kullanıyoruz. Sonuç a’ya da b’ye de dik olur.</p></div>
<div class="block"><h2>2. Determinantı +, −, + olarak aç</h2>${M('a × b = (aᵧb𝓏 − a𝓏bᵧ, &nbsp; a𝓏bₓ − aₓb𝓏, &nbsp; aₓbᵧ − aᵧbₓ)')}
<p>Ortadaki bileşen en sık yanlış yapılan kısım. Determinantı ilk satırdan açarken işaret sırası <b>+, −, +</b> olmak zorunda.</p>
${E('Krista’nın cross örneği','a=(1,2,3), b=(−1,0,3)',`<ol class="step-list"><li>x = 2·3−3·0 = 6</li><li>y = 3·(−1)−1·3 = −6</li><li>z = 1·0−2·(−1) = 2</li><li>a×b = <b>(6,−6,2)</b>.</li></ol>${M('a×b = <span class="result">(6, −6, 2)</span>')}`,'Krista: Cross products s.3–4')}
${E('RTU cevaplı cross örneği','a=(2,2,−1), b=(1,2,2)',`<ol class="step-list"><li>x = 2·2−(−1)·2 = 6</li><li>y = (−1)·1−2·2 = −5</li><li>z = 2·2−2·1 = 2</li></ol>${M('a×b = <span class="result">(6, −5, 2)</span>')}${N('Diklik kontrolü:','(6,−5,2)·(2,2,−1)=12−10−2=0. Diğer vektörle de dot=0 olur.')}`,'RTU 2_04, Alıştırma 1')}
${W('PDF işaret uyarısı:','RTU 2_04, s.1’de metin çıkarımında orta bileşenin işareti tutarsız görünebiliyor. Güvenilir hesap determinantın +,−,+ açılımıdır; PDF’de verilen çözümlü örnek de orta bileşeni −5 bulur.')}</div>
<div class="block"><h2>3. Cross neden alan verir?</h2><p>İki kenarı a ve b olan paralelkenarın alanı, taban × yükseklik = |a|·|b|·sinθ’dır. Bu da cross product vektörünün uzunluğudur.</p>${M('|a×b| = |a| |b| sinθ<br>Paralelkenar alanı = |a×b|<br>Üçgen alanı = ½|a×b|')}
${E('Alan hesapla','a=(1,2,3), b=(−1,0,3). Önceki cross (6,−6,2) idi.',`<ol class="step-list"><li>|a×b|=√(6²+(−6)²+2²)</li><li>=√(36+36+4)=√76 ≈ <b>8.72</b>.</li><li>Paralelkenar alanı √76, üçgen alanı √76/2.</li></ol>`,'Krista: Cross products s.5–7')}
</div><div class="block"><h2>4. Sağ el kuralı ve sıralama</h2><p>İşaret yalnızca hesap hatası değildir; cross product'ın yönünü belirtir. İşaret parmağın a’yı, orta parmağın b’yi, başparmağın a×b yönünü gösterir (sağ el).</p>${M('a × b = −(b × a)<br>i×j = k &nbsp; ; &nbsp; j×k = i &nbsp; ; &nbsp; k×i = j')}
${N('Sınavda önemli:','a×b ile b×a birbirinin zıttıdır. Alan soruluyorsa iki sonucun <b>uzunluğu</b> aynı olacağı için alan değişmez.')}
${W('Uygulama notu:','RTU 2_04 moment/torque bölümünde F×r sırası kullanılıyor; standart fizik tanımı çoğunlukla r×F’dir. İşaret yönünü seçerken soru ve dersin kullandığı sıralamayı aynen izlemelisin.')}</div>
`,'⨯');
add('triple','Triple product & hacim','Cross ve dot birleşince 3B hacim ortaya çıkar.','İleri',24,'RTU: 2_04 s.1–4 · Krista: Cross products bağlantısı',`
<div class="block"><h2>1. Mixed / scalar triple product nedir?</h2><p>Önce iki vektörün cross product’ını bul, çıkan vektörü üçüncü ile dot product yap. Sonuç bir <b>sayıdır</b>.</p>${M('T = (a × b) · c = det [ a ; b ; c ]')}
<p>Mutlak değeri, üç vektörün oluşturduğu paralelyüzlünün hacmidir. İşaret, yönlenmeyi gösterir.</p>${M('|T| = paralelyüzlü hacmi<br>|T|/6 = tetrahedron (üçgen piramit) hacmi')}
${N('Neden?', 'a×b tabanın alanını ve tabana dik yönü verir; c ile dot yapmak yüksekliği hesaba katar. Alan × yükseklik = hacim.')}</div>
<div class="block"><h2>2. Coplanar = aynı düzlemde</h2><p>Üç R³ vektör için triple product 0 ise üçü aynı düzlemdedir (coplanar) ve linearly dependent olur.</p>${M('(a×b)·c = 0 &nbsp; ⇔ &nbsp; coplanar (3 vektör, R³)')}
${E('RTU coplanarity','a=(4,−2,3), b=(1,−1,5), c=(2,0,−7)',`<ol class="step-list"><li>a×b = ((−2)5−3(−1), 3·1−4·5, 4(−1)−(−2)1)</li><li>a×b = (−7,−17,−2)</li><li>(a×b)·c = (−7)2 + (−17)0 + (−2)(−7)</li><li>= −14+14 = <b>0</b> → Coplanar.</li></ol>`,'RTU 2_04, Alıştırma 9(a)')}
</div><div class="block"><h2>3. Dört noktanın aynı düzlemde olup olmadığı</h2><p>Önce aynı başlangıçtan çıkan üç vektör elde edersin. A,B,C,D noktaları için <b>AB, AC, AD</b>. Bu üç vektörün triple product’ı sıfırsa dört nokta coplanar.</p>${E('RTU dört nokta','A(1,−1,2), B(3,4,0), C(2,−3,1), D(4,2,5)',`<ol class="step-list"><li>AB=(2,5,−2), AC=(1,−2,−1), AD=(3,3,3)</li><li>Triple product: det [2 5 −2; 1 −2 −1; 3 3 3]</li><li>Sonuç <b>−54 ≠ 0</b>.</li><li>Bu dört nokta <b>coplanar değildir.</b></li></ol>`,'RTU 2_04, Alıştırma 9(b)')}
${W('Karıştırma:','İki vektörün cross product’ı bir <b>vektör</b>, üç vektörün scalar triple product’ı bir <b>sayıdır</b>. Coplanar testi 3 vektör, 4 nokta sorularında kullanılır.')}</div>
<div class="block"><h2>4. Hangi geometri sorusunda hangi alan/hacim formülü?</h2><table class="mini-table"><thead><tr><th>Geometri</th><th>Formül</th></tr></thead><tbody><tr><td>Paralelkenar</td><td>|a×b|</td></tr><tr><td>Üçgen</td><td>½|a×b|</td></tr><tr><td>Paralelyüzlü</td><td>|(a×b)·c|</td></tr><tr><td>Üçgen prizma</td><td>½|(a×b)·c|</td></tr><tr><td>Tetrahedron</td><td>⅙|(a×b)·c|</td></tr></tbody></table></div>
`,'⬡');

<div class="block"><h2>Sınavda soru görünce ilk ne yapmalıyım?</h2><table class="mini-table"><thead><tr><th>Soru anahtarı</th><th>İlk yapacağın şey</th></tr></thead><tbody><tr><td>"Find magnitude / length"</td><td>Koordinat karelerini topla, karekök al</td></tr><tr><td>"AB vector"</td><td>B−A yap</td></tr><tr><td>"Unit vector"</td><td>Vektörü uzunluğuna böl</td></tr><tr><td>"Span / combination"</td><td>c₁a+c₂b=v denklemini kur</td></tr><tr><td>"Independent / dependent"</td><td>Önce boyuta ve vektör sayısına bak; sonra determinant/Gauss</td></tr><tr><td>"Dot product"</td><td>Karşılıklı bileşenleri çarpıp topla</td></tr><tr><td>"Angle between"</td><td>cosθ=(a·b)/(|a||b|)</td></tr><tr><td>"Perpendicular"</td><td>a·b=0 olup olmadığına bak (sıfır olmayanlar)</td></tr><tr><td>"Projection"</td><td>Skaler mi vektörel mi istendiğini belirle</td></tr><tr><td>"Cross product"</td><td>3B bileşen formülü; orta bileşenin işaretini koru</td></tr><tr><td>"Area"</td><td>|a×b|, üçgense 1/2 ile çarp</td></tr><tr><td>"Coplanar / Volume"</td><td>(a×b)·c veya 3×3 determinant</td></tr></tbody></table></div>
<div class="block"><h2>Tüm formüller — tek bakışta</h2><div class="formula-list" id="formulaGrid"></div></div>
<div class="block"><h2>En sık yapılan 7 hata</h2><ol><li><b>AB yerine A−B:</b> Yön tersine döner.</li><li><b>Norm için koordinatları toplamak:</b> √(x²+y²+z²) kullanılmalı.</li><li><b>Dot çarpımı vektör sanmak:</b> Dot tek sayıdır; cross vektördür.</li><li><b>θ ile cosθ'yı karıştırmak:</b> cosθ değerinden derece bulmak için arccos gerekir.</li><li><b>Cross ortadaki − işaretini atlamak:</b> +,−,+ açılımını kontrol et.</li><li><b>LI için yalnızca vektör sayısını yeterli saymak:</b> Boyuttan çoksa LD; eşitse ayrıca test gerekir.</li><li><b>Projeksiyonun hangi vektöre olduğunu unutmak:</b> a onto b ise bölen |b|, vektörel projeksiyonsa |b|².</li></ol></div>

const deep={
start:`<div class="focus-banner"><span>YENİ · DAHA AÇIK ANLATIM</span><h2>Sıfırdan öğreniyorsan şu sırayı izle</h2><p><b>1.</b> Vektörü oka benzet → <b>2.</b> Okları topla → <b>3.</b> Aynı oklarla hangi noktalara gidebildiğini (span) anla → <b>4.</b> Yeni bir yön gelip gelmediğine (independence) bak → <b>5.</b> Dot ve cross’a geç.</p><div class="lesson-route"><button onclick="go('projection')">İzdüşümü anlamak →</button><button onclick="go('span')">Span’i sıfırdan öğren →</button><button onclick="go('li2')">Independence kavramı →</button></div><p class="muted-note">Önce anlama, sonra formül, ardından RTU tarzı örnek. Her açıklamadaki “çözümü göster” bölümü kendi kendine çalışman için kapalı başlar.</p></div>`,
vectors:`<div class="deep-zone"><span class="deep-tag">MANTIKTAN BAŞLA</span><h2>Vektörü bir nokta ile karıştırma</h2>${slow('“A noktasından B noktasına hangi hareket yapıldı?”','A(1,2) ve B(4,6) arasında 3 birim sağa, 4 birim yukarı yürüdüğünü düşün.','AB = (4−1,6−2) = (3,4).','AB’nin uzunluğu √(3²+4²)=5. Aynı oku başka yerden çizsen de yönü ve uzunluğu değişmez.')}${N('R² / R³ ne demek?','R² içinde her vektörün <b>2 bileşeni</b>, R³ içinde <b>3 bileşeni</b> vardır. Üç koordinatının olması 3 ayrı vektörün olduğu anlamına gelmez.')}${lessonNote('RTU 2_01 · s.1','Serbest, kayabilen ve sabit vektör ayrımı','<p>RTU üç terimi tanıtır: <b>free</b> (istediğin yere taşı), <b>sliding</b> (yalnızca bulunduğu doğru boyunca taşı), <b>fixed</b> (başlangıcı belirli). Bu matematik konularında kullanılan tür <b>serbest vektördür</b>.</p>')}</div>`,
operations:`<div class="deep-zone"><span class="deep-tag">RTU’DA EK OLARAK VAR · 2_01</span><h2>Üçgen / paralelkenar kuralı gerçekte ne yapıyor?</h2><p><b>Üçgen yöntemi:</b> Evden 3 sokak doğuya, sonra 2 sokak kuzeye yürüdün. Başlangıçtan bulunduğun yere çizilen tek ok senin <b>toplam hareketindir</b>. İlk okun ucuna ikinci okun kuyruğunu takarsın.</p><p><b>Paralelkenar yöntemi:</b> İki hareketi aynı başlangıçtan çiz. Kenarları tamamla. Başlangıçtan karşı köşeye giden çapraz ok yine aynı toplamdır. <b>Paralelkenar = farklı çizim, aynı toplama.</b></p>${E('RTU 2_01 — iki dik vektörün toplam ve fark uzunluğu','|a| = 6, |b| = 8, a ⟂ b. |a+b| ve |a−b| kaç?',`<ol class="step-list"><li>Dik olduklarından bir dik üçgen oluşur.</li><li>|a+b| = √(6²+8²) = √100 = <b>10</b>.</li><li>|a−b| = √(6²+8²) = <b>10</b>. b tersine dönse de 90° korunur.</li></ol>${G('Sonuç:','İki uzunluk da 10. Vektörlerin kendileri farklıdır; yalnızca uzunlukları aynıdır.')}`,'RTU 2_01 s.2, Exercise 1.2')}${reveal('Mini düşünce sorusu: AB + BC neden AC?',`<p>AB: A’dan B’ye git. BC: kaldığın B’den C’ye git. Geriye yalnızca başlangıç A ile bitiş C arasındaki hareket kalır. Yani <b>AB+BC=AC</b>. Araya yeni bir nokta girse bile aynı mantık sürer.</p>`)}</div>`,
coordinates:`<div class="deep-zone"><span class="deep-tag">SIFIR HATA İÇİN</span><h2>AB ile BA neden birbirine zıt?</h2>${slow('A(−2,3), B(4,1) verilince AB soruluyor.','A’dan B’ye sağa 6, aşağı 2 ilerlersin. BA olsaydı sola 6, yukarı 2 giderdin.','AB=(4−(−2),1−3)=(6,−2), BA=(−6,2).','AB+BA=(0,0). Karşılıklı hareketler birbirini götürür.')}${lessonNote('RTU 2_01 · s.2','Üçgenin ağırlık merkezi (mass centre / centroid)',`<p>RTU sorusunda <b>a=AB</b>, <b>b=AC</b> ve <b>O üçgenin ağırlık merkezi</b>. O noktasına ulaşmak için A’dan (a+b)/3 gidilir.</p>${M('AO = (a+b)/3<br>BO = BA + AO = −a + (a+b)/3 = <b>(b−2a)/3</b>')}<p>Başlangıcı B olduğu için neden <b>−a</b> gerektiğine dikkat et: B’den A’ya geri dönmen gerekir.</p>`)}${lessonNote('RTU 2_01 · s.2','Doğru parçasını belli oranda bölen M noktası',`<p>M, A ile B arasında ve AM/AB = 2/5 ise A’dan B’ye yolun yalnızca 2/5’ini alırsın.</p>${M('PM = PA + AM = p + (2/5)(PB−PA)<br><b>PM = (3/5)p + (2/5)q</b>')}<p>Burada p=PA ve q=PB. Uzun cebir yerine “A’dan başladım, B’ye doğru %40 yürüdüm” düşüncesi işe yarar.</p>`)}</div>`,
unit:`<div class="deep-zone"><span class="deep-tag">RTU’NUN ÖZEL BAŞLIĞI · 2_02</span><h2>Direction cosines ve unit vector aynı hikâyenin parçaları</h2><p>Bir vektörün uzunluğunu 1 yapınca elinde yalnızca <b>yön bilgisi</b> kalır. RTU’nun <b>direction cosines</b> dediği cosα, cosβ ve cosγ tam da bu birim vektörün x, y, z bileşenleridir.</p>${M('a = (aₓ,aᵧ,a𝓏), |a| ≠ 0<br>a₀ = (aₓ/|a|, aᵧ/|a|, a𝓏/|a|)<br> = (cosα, cosβ, cosγ)')}${E('Yön kosinüslerini bul','a=(2,−2,1) veriliyor.',`<ol class="step-list"><li>Uzunluğu: √(4+4+1)=3.</li><li>Birim vektörü: (2/3,−2/3,1/3).</li><li>cosα=2/3, cosβ=−2/3, cosγ=1/3.</li><li>Kontrol: 4/9+4/9+1/9=<b>1</b>.</li></ol>${G('İşaret:', 'cosβ negatif olduğu için y ekseninin pozitif yönüyle yaptığı açı geniş açıdır.')}`)}${reveal('Eğer vektör b ile antiparallel ve uzunluğu 3 ise nasıl bulunur?',`<p>RTU Exercise 2_02, 3: b=(3,−6,−6). Önce |b|=9. Birim vektör b/9=(1/3,−2/3,−2/3). Zıt yöndeki 3 birimlik vektör: −3(b/9)=<b>(−1,2,2)</b>.</p>`)}</div>`,
projection:`<div class="deep-zone"><span class="deep-tag">ÖNCELİK 1 · RTU 2_01 + 2_03</span><h2>İzdüşümü ilk defa öğreniyormuş gibi başlayalım</h2><p>Vektör <b>çapraz</b> duruyor ama sen yalnızca <b>sağa-sola ne kadar gitmiş</b> diye soruyorsun. İzdüşüm, bu çapraz okun seçtiğin doğru üzerindeki <b>gölgesidir</b>. Yukarı-aşağı parçasını yok sayarsın.</p>${slow('a=(3,4) okunun x doğrultusundaki etkisini bul.','(3,4) vektörünün ucu x=3 hizasındadır. Oku x eksenine dik indirirsen gölgesi x=3’e düşer.','b=(1,0) seç: a·b=3·1+4·0=3 ve |b|=1. Skaler izdüşüm 3/1=<b>3</b>.','a’nın uzunluğu 5’tir ama x yönündeki payı sadece 3’tür. 5 sonucunu bulduysan <b>vektör uzunluğu</b> ile <b>izdüşümü</b> karıştırdın.')}
<div class="interactive-experiment"><div class="experiment-title"><span>CANLI DENE</span><h3>Vektörü döndür; gölgesi nasıl değişiyor?</h3></div><p>Turuncu a oku yukarı döndükçe alttaki yeşil gölge kısalır. 90°’de sıfır, 90° sonrasında ise <b>negatif</b> olur.</p><div class="experiment-controls"><label>Açı <output id="projDeg">60°</output><input id="projAngle" type="range" min="0" max="180" step="15" value="60"></label><label>a uzunluğu <output id="projLenText">4</output><input id="projLen" type="range" min="1" max="5" step="1" value="4"></label></div><svg id="projectionLive" viewBox="0 0 640 315" role="img" aria-label="İzdüşümün, vektör açısı değiştikçe pozitif sıfır negatif olması"></svg><div class="experiment-result" id="projectionLiveResult"></div></div>
<h3>Formülü ezberlemeden çıkaralım</h3><p>Bir dik üçgende cosθ = <b>komşu kenar / hipotenüs</b>. Burada hipotenüs a vektörünün uzunluğudur, komşu kenar onun gölgesidir.</p>${M('cosθ = (gölge)/|a| &nbsp; ⟹ &nbsp; gölge = |a|cosθ')}<p>Dot product için a·b = |a||b|cosθ olduğunu biliyoruz. İki tarafı <b>|b|</b> ile bölünce:</p>${M('(a·b)/|b| = |a|cosθ = <b>skaler izdüşüm</b>')}
<div class="compare-grid"><div><span class="compare-kicker">SKALER PROJEKSİYON</span><h3>“Ne kadar?”</h3><p>Yalnızca <b>işaretli sayı</b> verir.</p>${M('compᵦ a = (a·b)/|b|')}<p>Örnek: −3 birim → b yönünün tersine.</p></div><div><span class="compare-kicker">VEKTÖREL PROJEKSİYON</span><h3>“Hangi yönde?”</h3><p>Uzunluk + yön içeren <b>vektör</b> verir.</p>${M('projᵦ a = [(a·b)/|b|²]b')}<p>Örnek: (−3,0) → sola doğru ok.</p></div></div>
${E('Aynı örnekte iki ayrı cevap','a=(3,4), b=(2,0). a’nın b üzerine (1) skaler, (2) vektörel izdüşümü?',`<ol class="step-list"><li>Dot product: a·b = 3·2+4·0 = <b>6</b>.</li><li>b uzunluğu: |b|=2; karesi |b|²=4.</li><li>Skaler projeksiyon = 6/2 = <b>3</b> (sayı).</li><li>Vektörel projeksiyon = (6/4)(2,0) = <b>(3,0)</b> (vektör).</li></ol>${N('Neden b=(2,0) olsa da gölge 3?', 'b’nin uzunluğu gölgenin uzunluğunu değiştirmez; sadece doğruyu ve pozitif yönü gösterir. Formülde |b| ile bölmemizin nedeni budur.')}`)}
${E('Negatif gölge örneği','a=(−3,4), b=(2,0)',`<ol class="step-list"><li>Dot: (−3)·2 + 4·0 = −6.</li><li>Skaler izdüşüm: −6/2 = <b>−3</b>.</li><li>Vektörel izdüşüm: (−6/4)(2,0)=<b>(−3,0)</b>.</li></ol>${G('Önemli:', '−3 “eksi uzunluk” değildir. İşareti, b’nin gösterdiği yönün <b>tersi</b> olduğunu anlatır.')}`)}
${lessonNote('RTU 2_01 · s.2','Noktaların eksene izdüşümü: A′ ve B′',`<p>RTU önce A ve B noktalarını eksene indirir; yeni noktalar A′ ve B′ olur. Gölgede A′→B′ yönü eksenle aynıysa <b>+</b>, tersse <b>−</b>. İşte bu işaretli A′B′ uzunluğu, <b>projᵤ(AB)</b> değeridir.</p><p>Çizimde sadece dik üçgen bulman yeter: a’nın boyu hipotenüs, a’nın u boyunca gölgesi komşu kenardır.</p>`)}
${lessonNote('RTU 2_02 · s.1','Koordinatlar zaten eksen izdüşümleridir',`<p>a=(aₓ,aᵧ,a𝓏) yazınca aₓ, aᵧ ve a𝓏 değerleri a vektörünün üç koordinat ekseni üzerindeki <b>işaretli projeksiyonlarıdır</b>.</p>${M('aₓ=|a|cosα, &nbsp; aᵧ=|a|cosβ, &nbsp; a𝓏=|a|cosγ')}`)}
${reveal('Kontrol: a=(4,3), b=(0,5). b üzerine skaler izdüşüm?',`<p>a·b=4·0+3·5=15, |b|=5. Skaler izdüşüm <b>15/5 = 3</b>. Vektörel izdüşüm (15/25)(0,5)=<b>(0,3)</b>.</p>`)}
</div>`,
span:`<div class="deep-zone"><span class="deep-tag">ÖNCELİK 2 · KRISTA + RTU</span><h2>Linear combination ve span'i karıştırma</h2><p>Bir elinde iki çeşit LEGO parçası olduğunu düşün: <b>a</b> ve <b>b</b>. Aynı parçadan istediğin kadar alabilir (hatta negatif katsayı ile ters çevirebilir) ve bunları birleştirebilirsin.</p><div class="concept-trio"><div><span>01</span><b>Linear combination</b><p>Belirli katsayıları seçtiğin <b>tek bir tarif</b>: 2a−3b.</p></div><div><span>02</span><b>Span</b><p>Her türlü katsayıyla üretebileceğin <b>bütün vektörler</b>.</p></div><div><span>03</span><b>Linear independence</b><p>Parçalardan biri <b>diğerlerini kullanarak üretilebiliyor mu?</b></p></div></div>
${slow('a=(1,0), b=(0,1) ve 2a+3b hesabı.','a sağa 1, b yukarı 1 yönünde. İki a = 2 sağa; üç b = 3 yukarı.','2a+3b=2(1,0)+3(0,1)=(2,0)+(0,3)=<b>(2,3)</b>.','Katsayıları (−5,7) seçseydin (−5,7) oluşacaktı. Yani bu iki temel okla düzlemin her noktasına varabiliyorsun.')}
<div class="interactive-experiment"><div class="experiment-title"><span>CANLI DENE</span><h3>İki oku karıştırarak hedef vektörü üret</h3></div><p>İki katsayıyı sürükle. Önce a’nın katını, sonra b’nin katını ekliyoruz. “Bağımlı” seçince bütün sonuçların <b>tek doğruya sıkıştığını</b> gör.</p><div class="experiment-controls"><label>Vektör çifti<select id="comboMode"><option value="ind">Bağımsız: a=(2,1), b=(−1,2)</option><option value="dep">Bağımlı: a=(2,1), b=(4,2)</option></select></label><label>a katsayısı <output id="comboC1V">2</output><input type="range" id="comboC1" min="-3" max="3" step="1" value="2"></label><label>b katsayısı <output id="comboC2V">1</output><input type="range" id="comboC2" min="-3" max="3" step="1" value="1"></label></div><svg id="comboLive" viewBox="0 0 640 330" role="img" aria-label="Linear combination katsayılarının vektörlerin toplamını değiştirmesi"></svg><div class="experiment-result" id="comboLiveResult"></div></div>
<h3>“Span’i vardır” ile “R²’yi span eder” aynı değil</h3><div class="compare-grid"><div><span class="compare-kicker">Aynı doğrultu</span><h3>a=(1,1), b=(2,2)</h3>${M('c₁a+c₂b=(c₁+2c₂,c₁+2c₂)')}<p>İlk koordinat hep ikinciye eşit. Mesela (3,0) <b>asla elde edilemez</b>. Span yalnızca y=x doğrusudur.</p></div><div><span class="compare-kicker">İki farklı doğrultu</span><h3>a=(1,0), b=(0,1)</h3>${M('c₁a+c₂b=(c₁,c₂)')}<p>İstediğin (x,y) için c₁=x, c₂=y yap. Span <b>tüm R²</b> olur.</p></div></div>
<h3>Hedef vektör gerçekten span içinde mi?</h3>${E('Katsayıları bilmediğinde çöz','a=(2,1), b=(1,1), hedef v=(7,4). v, span(a,b) içinde mi?',`<ol class="step-list"><li>İki bilinmeyen katsayı yaz: <b>sa + tb = v</b>.</li><li>s(2,1)+t(1,1)=(7,4).</li><li>Koordinatlara ayır: <b>2s+t=7</b>, <b>s+t=4</b>.</li><li>İlk denklemden ikincisini çıkar: <b>s=3</b>.</li><li>s+t=4 → t=<b>1</b>.</li><li>Kontrol: 3(2,1)+1(1,1)=(6,3)+(1,1)=<b>(7,4)</b>.</li></ol>${G('Karar:','Evet! Hedef vektör a ve b’nin doğrusal birleşimi olarak yazılabiliyor. v ∈ span(a,b).')}`)}
${E('Hedefe ulaşılamadığı durum','a=(1,2), b=(2,4), hedef v=(3,1).',`<ol class="step-list"><li>sa+tb=(s+2t,2s+4t)=(3,1).</li><li>İlk koordinat: s+2t=3.</li><li>İkinci koordinat: 2s+4t=1.</li><li>İlk denklemi 2 ile çarpınca <b>2s+4t=6</b>, ama ikinci denklem <b>1</b> diyor.</li></ol>${W('Çelişki:','Aynı ifade hem 6 hem 1 olamaz. Dolayısıyla <b>v span içinde değil</b>. Bu iki ok yalnızca y=2x doğrultusunu üretir.')}`)}
${lessonNote('RTU 2_02 · s.2','RTU “linear combination” tanımı ile bağlantı',`<p>Hocanın PDF’sinde doğrusal birleşim <b>c₁a₁+c₂a₂+…+cₙaₙ</b> şeklinde tanımlanıyor. Span bunun <b>tüm katsayı seçenekleri</b> için ürettiği kümedir. RTU’nun bir sonraki tanımı olan <b>linear dependence</b> ise bu birleşimin özel olarak sıfır vektörüne eşitlenmesidir.</p>`)}
${reveal('İki vektör tek başlarına R³’ün tamamını span edebilir mi?',`<p><b>Hayır.</b> R³ üç boyutludur. Bağımsız iki vektör bir <b>düzlem</b> span eder; R³’ün tamamı için üçüncü bağımsız yön gerekir. İki vektör birbirinin katıysa span yalnızca bir doğru olur.</p>`)}
</div>`,
li2:`<div class="deep-zone"><span class="deep-tag">ÖNCELİK 3 · EN ÇOK KARIŞTIRILAN</span><h2>Linear independent / dependent: neyi test ediyoruz?</h2><p><b>Yeni bir yön ekleniyor mu?</b> Linear independence’ın tüm fikri bu. Elinde zaten (1,0) varsa (2,0) sana yeni yön vermez; sağa giden okun sadece daha uzunudur. Ama (0,1) yukarı yönünü ekler.</p><div class="compare-grid"><div><span class="compare-kicker">DEPENDENT — bağımlı</span><h3>(1,2) ve (3,6)</h3><p>İkincisi ilkinin <b>3 katı</b>. Yeni yön yok. Yalnızca <b>bir doğru</b> span ederler.</p></div><div><span class="compare-kicker">INDEPENDENT — bağımsız</span><h3>(1,2) ve (3,5)</h3><p>Tek bir sayı ile birbirine dönüşmezler. İki ayrı yön verirler, birlikte <b>R²’yi span</b> ederler.</p></div></div>
${slow('“a=(2,4) ve b=(3,6) bağımsız mı?”','Birinin ilk koordinatını 1.5 ile çarptığında 3, ikincisini 1.5 ile çarptığında 6 gelir. Yani b=1.5a.','b−1.5a=(0,0). Sıfır toplamı için <b>b’nin katsayısı 1</b>, <b>a’nın katsayısı −1.5</b>.','En az bir katsayı sıfırdan farklı ama toplam sıfır → <b>LINEARLY DEPENDENT</b>.')}
<h3>Neden hep c₁a+c₂b=0 yazıyoruz?</h3><p>Bu formül hocanın bağımlılık tanımının kendisi. Vektörleri birbirini yok edecek şekilde ağırlıklandırabiliyor musun?</p>${M('<b>c₁a + c₂b = (0,0)</b>')}<ul><li><b>c₁=c₂=0</b> her zaman çalışır, çünkü 0a+0b=0 zaten.</li><li>Bunun <b>dışında bir çözüm</b> de varsa → <b>DEPENDENT</b>.</li><li>Tek çözüm <b>c₁=c₂=0</b> ise → <b>INDEPENDENT</b>.</li></ul>
${E('Katsayı yöntemini en yavaş haliyle yap','a=(1,2), b=(2,1) bağımsız mı?',`<ol class="step-list"><li>c₁(1,2)+c₂(2,1)=(0,0) yaz.</li><li>İlk koordinat: <b>c₁+2c₂=0</b>.</li><li>İkinci koordinat: <b>2c₁+c₂=0</b>.</li><li>Birinci denklemin 2 katı: <b>2c₁+4c₂=0</b>.</li><li>Bu denklemden ikinciyi çıkar: <b>3c₂=0</b> → c₂=0.</li><li>c₁+2·0=0 → c₁=0.</li></ol>${G('Sonuç:','Yalnızca 0,0 var → <b>INDEPENDENT</b>.')}`)}
<h3>2×2 determinant niye aynı sonucu verir?</h3>${M('a=(a₁,a₂), b=(b₁,b₂)<br>det = a₁b₂−a₂b₁')}<p>İki vektörün oluşturduğu paralelkenarın <b>işaretli alanı</b> gibi düşünebilirsin. Aynı doğru üzerindelerse paralelkenar çöker, alan <b>0</b> olur. Ayrı doğrultudaysalar alan sıfırdan farklıdır.</p>${E('Determinantı yanlış yazmamak için','a=(2,3), b=(4,5)',`<ol class="step-list"><li>Önce matrisi yaz: üst satır <b>2 4</b>, alt satır <b>3 5</b>.</li><li>Sol üst × sağ alt = <b>2×5=10</b>.</li><li>Sağ üst × sol alt = <b>4×3=12</b>.</li><li>Çıkar: <b>10−12=−2</b>.</li></ol>${G('Karar:','−2 sıfır değildir → <b>INDEPENDENT</b>. Negatif determinant dependent anlamına GELMEZ; yalnızca 0 olup olmadığına bak.')}`)}
<h3>Vektör sayısı = boyut kuralını yanlış kullanma</h3><div class="truth-table"><div><b>R²’de 3 vektör</b><span>Kesinlikle DEPENDENT. Çünkü boyuttan fazla.</span></div><div><b>R²’de 2 vektör</b><span>Test et. Aynı doğrultuysa dependent, değilse independent.</span></div><div><b>R²’de 1 sıfır olmayan vektör</b><span>INDEPENDENT ama <b>R²’yi span edemez</b>.</span></div><div><b>İçinde sıfır vektörü var</b><span>Kesinlikle DEPENDENT.</span></div></div>
${lessonNote('Krista King · LI in two dimensions','“3 vektör R²’de neden bağımlı?”',`<p>Önce iki bağımsız ok seçersen bunlar zaten R²’nin tamamını span eder. Üçüncü hangi yöne giderse gitsin ilk ikisinin birleşimiyle elde edilebilir. Bu yüzden <b>küme olarak üçü bağımlı</b> olur. Üçünden ikisi hâlâ independent olabilir.</p>${M('a=(1,0), b=(0,1), c=(3,2)<br>c=3a+2b → a,b,c kümesi LD')}<p>Unutma: <b>dependent küme</b> demek <b>her çift dependent</b> demek değildir.</p>`)}
${reveal('Kontrol: a=(2,4), b=(−1,−2) aynı yönde mi?',`<p>b=−0.5a olduğu için <b>DEPENDENT</b>. Ancak yönleri <b>zıt</b>. Linear dependence için aynı yöne bakmaları gerekmiyor; biri diğerinin negatif katı da olabilir.</p>`)}
</div>`,
li3:`<div class="deep-zone"><span class="deep-tag">ÖNCELİK 4 · RTU 2_02</span><h2>Üç boyutta (R³) independence'ı düşünme yöntemi</h2><p>Birinci ok sana bir <b>doğru</b> verir. Onun katı olmayan ikinci okla bir <b>düzlem</b> elde edersin. Üçüncü ok bu düzlemin dışına çıkıyorsa nihayet <b>3B uzayın tamamına</b> ulaşabilirsin.</p><div class="truth-table"><div><b>R³’te 2 bağımsız vektör</b><span>Bir düzlem span eder; R³’ün tamamını DEĞİL.</span></div><div><b>R³’te 3 bağımsız vektör</b><span>Tüm R³’ü span eder.</span></div><div><b>R³’te 3 coplanar vektör</b><span>Aynı düzlem → DEPENDENT → determinant 0.</span></div><div><b>R³’te 4 vektör</b><span>Her zaman DEPENDENT.</span></div></div>
<h3>3×3 determinantı 3 küçük 2×2 işlemi olarak çöz</h3>${M('det = a(ei−fh) − b(di−fg) + c(dh−eg)<br>Matris = [a b c; d e f; g h i]')}<p>Ezber: <b>+, −, +</b>. Önce sol üstteki elemanla, sonra üst ortadakiyle, sonra üst sağdakiyle çalışırsın. Her seferinde onun satırını ve sütununu zihninde sil; kalan 2×2’nin <b>ad−bc</b> hesabını yap.</p>
${E('En kolay 3×3 determinant','a=(1,0,0), b=(0,1,0), c=(0,0,1)',`<ol class="step-list"><li>Satırlar: [1 0 0; 0 1 0; 0 0 1].</li><li>İlk terim: <b>1(1·1−0·0)=1</b>.</li><li>İkinci ve üçüncü terimin başında 0 var, ikisi de 0.</li><li>det=<b>1≠0</b>.</li></ol>${G('Sonuç:', 'Üç bağımsız yön → R³’ün tamamı span edilir.')}`)}
${E('RTU 2_02, alıştırma 8(a)','a=(5,2,1), b=(1,−1,2), c=(0,1,−3): bağımlı mı?',`<ol class="step-list"><li>Üç vektörü satır olarak yaz: [5 2 1; 1 −1 2; 0 1 −3].</li><li>Birinci küçük determinant: (−1)(−3)−2(1)=<b>1</b>.</li><li>İkinci: 1(−3)−2(0)=<b>−3</b>.</li><li>Üçüncü: 1(1)−(−1)(0)=<b>1</b>.</li><li>det=5·1−2·(−3)+1·1=<b>12</b>.</li></ol>${G('Cevap:', '12≠0 → INDEPENDENT. RTU cevap anahtarıyla aynı.')}`,'RTU 2_02 s.2–3')}
${E('RTU 2_02, alıştırma 8(b)','a=(3,−1,2), b=(2,0,−1), c=(1,−3,10): determinant 0. c’yi a ve b ile yaz.',`<ol class="step-list"><li>c = sa+tb diye kur: (1,−3,10)=s(3,−1,2)+t(2,0,−1).</li><li>y koordinatı: <b>−s=−3 → s=3</b>.</li><li>x koordinatı: <b>3s+2t=1</b> → 9+2t=1 → <b>t=−4</b>.</li><li>z kontrolü: <b>2s−t=6+4=10</b>, doğru!</li></ol>${M('<b>c = 3a − 4b</b>')}${G('Cevap:', 'Bir vektör diğer ikisinin kombinasyonu → DEPENDENT. Bu soruda sadece “det=0” yazmak yetmez; c’yi açıkça yazmak isteniyor.')}`,'RTU 2_02 s.2–3')}
<h3>Gauss (row reduction) kullanacağın durum</h3><p>Vektörler <b>kare matris</b> oluşturmuyorsa determinantı doğrudan kullanma. c₁a+c₂b+…=0 denklemini kur, koordinatlara ayır ve satır işlemleriyle çöz. Her vektör sütun olacak şekilde matrisini oluştur.</p>${E('R³’te iki vektör için 3×3 determinant gerekmez','a=(1,0,2), b=(0,1,3).',`<ol class="step-list"><li>c₁a+c₂b=0 → (c₁,c₂,2c₁+3c₂)=(0,0,0).</li><li>İlk koordinat c₁=0 diyor.</li><li>İkinci koordinat c₂=0 diyor.</li><li>Başka çözüme gerek yok; son koordinat da zaten 0 olur.</li></ol>${G('Cevap:', 'İki vektör INDEPENDENT ama yalnızca bir düzlem span ediyor.')}`)}
${reveal('“Coplanar” ne demek?',`<p>Üç vektörün <b>aynı düzlem içerisinde</b> olmasıdır. Başlangıç noktalarını aynı yere taşıdığında biri diğer ikisinin oluşturduğu düzlemin dışına çıkamıyorsa üçüncü yeni yön eklemez. 3B’de üç vektör için <b>coplanar ⇔ triple product=0 ⇔ dependent</b>.</p>`)}
</div>`,
dot:`<div class="deep-zone"><span class="deep-tag">İKİ FORMÜLÜ AYIRT ET</span><h2>Dot product neden iki farklı formülle anlatılıyor?</h2><p>İki ayrı dot product yok. <b>Tek işlem</b> var; sorunun verdiği bilgilere göre iki farklı yoldan hesaplanıyor.</p>${formulaSwitch}${E('Aynı sorunun iki yöntemle çözümü','a=(3,0), b=(3,4)',`<ol class="step-list"><li>Koordinat yöntemi: a·b=3·3+0·4=<b>9</b>.</li><li>|a|=3, |b|=5. İki vektörün arasındaki cosθ=3/5.</li><li>Geometrik yöntem: 3·5·(3/5)=<b>9</b>.</li></ol>${G('Sonuç:', 'İki formül de aynı 9 sayısını verir.')}`)}
<h3>Dot product ile diklik ve iş nasıl çıkıyor?</h3>${lessonNote('RTU 2_03 · s.1–2','RTU’da mechanical work (mekanik iş)',`<p>Bir kuvvet hareket yönünde ne kadar etki ediyor diye hesaplıyoruz. <b>İş = kuvvet · yer değiştirme</b>. Diklikte iş 0 çıkar; çünkü kuvvet hareketin yönüne katkı sağlamaz.</p>${E('RTU 2_03, Exercise 5','F=(2,−4,5), A(3,−1,2), B(5,−2,3). Yapılan iş?',`<ol class="step-list"><li>Önce yer değiştirme: AB=B−A=(2,−1,1).</li><li>İş: F·AB=2·2+(−4)(−1)+5·1</li><li>=4+4+5=<b>13</b>.</li></ol><p>Verilen birimlere göre sonuç iş birimidir (örneğin N·m = joule).</p>`,'RTU 2_03 s.2')}`)}
${reveal('Soruda 3x·(−2y−z) verilirse nasıl en az hatayla çözersin?',`<p>Önce parantez: −2y−z. Ardından 3x vektörünü oluştur, karşılıklı bileşenleri çarp ve topla. Önceki örneğimizde x=(−4,−2,7), y=(6,−1,−10), z=(3,−2,0) idi: 3x=(−12,−6,21), −2y−z=(−15,4,20) → 180−24+420=<b>576</b>.</p>`)}
</div>`,
angle:`<div class="deep-zone"><span class="deep-tag">SADECE AÇI İSTENİYORSA</span><h2>Cosθ bulmak, θ bulmak değildir</h2>${slow('a=(1,0), b=(0,1) vektörleri arasındaki açı.','Bu iki ok x ve y eksenlerinde, birbirlerine diktir. Gözle 90° bekliyoruz.','a·b=0. |a|=|b|=1 → cosθ=0 → θ=cos⁻¹(0)=<b>90°</b>.','Soru yalnızca “cosθ” isteseydi <b>0</b> yazmak yeterdi. “Angle” istiyorsa <b>90°</b> yazmalısın.')}${W('Hesap makinesi gerekebilir:', 'Özel açı yoksa θ=arccos(kesir) biçimi matematiksel olarak tam ifadedir. Ancak soru yaklaşık derece istiyorsa bilimsel hesap makinesinin cos⁻¹ fonksiyonu gerekir. Sınavda cihaz kullanım kurallarını hocadan doğrulamalısın.')}${E('RTU tarzı açı işareti','a=(−1,2), b=(3,1). Açı dar mı geniş mi?',`<ol class="step-list"><li>Dot product = −1·3+2·1=<b>−1</b>.</li><li>Dot negatif → cosθ negatif.</li><li>cosθ 90°–180° arasında negatiftir.</li></ol>${G('Cevap:', 'Geniş açı. Gerçek dereceyi bilmeden karar verebilirsin.')}`)}</div>`,
cross:`<div class="deep-zone"><span class="deep-tag">RTU’DAKİ İŞARET KARIŞIKLIĞINA DİKKAT</span><h2>Cross product ortadaki eksi neden unutuluyor?</h2><p>Cross product sonucu <b>tek sayı değil, üç bileşenli bir vektör</b>. İlk ve üçüncü bileşen normal 2×2 determinant gibi; orta bileşende <b>eksi işareti</b> var.</p>${M('a×b = (aᵧb𝓏−a𝓏bᵧ, −(aₓb𝓏−a𝓏bₓ), aₓbᵧ−aᵧbₓ)')}${slow('a=(1,0,0), b=(0,1,0) için cross.','x yönündeki ve y yönündeki oklara aynı anda dik olan ok z yönüne bakar.','x=0·0−0·1=0; y=−(1·0−0·0)=0; z=1·1−0·0=1.','a×b=<b>(0,0,1)</b>. b×a=(0,0,−1) olur; sırayı değiştirmek yönü ters çevirir.')}
${lessonNote('RTU 2_04 · s.2–3','Alan ve yüksekliği birlikte soran üçgen',`<p>Hocanın alıştırması: A(2,0,−1), B(1,3,−2), C(5,5,2). Önce <b>AB</b> ve <b>AC</b> bulursun; sonra cross çarpımının uzunluğunun yarısı üçgenin alanıdır.</p>${M('AB=(−1,3,−1), AC=(3,5,3)<br>AB×AC=(14,0,−14)<br>Alan = √(14²+14²)/2 = <b>7√2</b>')}<p>BC=(4,2,4), |BC|=6. Alan=(1/2)·taban·yükseklik → yükseklik = (2·7√2)/6 = <b>7√2/3</b>.</p>`)}
${reveal('RTU çapraz çarpım örneğinde orta işareti nasıl kontrol edilir?',`<p>a=(2,2,−1), b=(1,2,2) için a×b=(6,−5,2). Sonucun a’ya dot’u: 12−10−2=0; b’ye dot’u: 6−10+4=0. <b>İkisine de dik</b>, yani sonuç tutarlı.</p>`)}</div>`,
triple:`<div class="deep-zone"><span class="deep-tag">RTU 2_04 · ÖNEMLİ EK KONU</span><h2>Triple product = önce taban alanı, sonra yükseklik</h2><p>Önce a×b hesaplanır: bu tabana dik bir vektördür ve uzunluğu tabanın alanıdır. Ardından c ile dot yaparsın: c’nin tabana <b>dik parçasını</b> hesaba katarsın. <b>Alan × dik yükseklik = hacim.</b></p>${M('(a×b)·c = <b>işaretli hacim</b><br>|(a×b)·c| = <b>hacim</b>')}
${E('En basit örnek','a=(2,0,0), b=(0,3,0), c=(0,0,4)',`<ol class="step-list"><li>Tabanı oluşturan iki yön dik: 2×3=<b>6</b> birim².</li><li>a×b=(0,0,6).</li><li>(a×b)·c=(0,0,6)·(0,0,4)=<b>24</b>.</li><li>Paralelyüzlü hacmi = 24, tetrahedron hacmi = 24/6=<b>4</b>.</li></ol>`)}
${lessonNote('RTU 2_04 · s.2','Torquе (moment) sorusunda çarpım sırası',`<p>RTU alıştırmasında kuvvet <b>F=f₁+f₂+f₃</b> bulunur, konum farkı <b>r=BA</b> alınır; derste verilen sırayla <b>M=F×r</b> hesaplanır. Standart fizik kaynaklarının çoğunda r×F kullanıldığı için işaret değişebilir. <b>Sorunun verdiği tanım esas alınır.</b></p><p>RTU Exercise 7: F=(4,2,2), r=(−1,−1,2) → F×r=(6,−10,−2).</p>`)}
${reveal('Coplanar olan üç vektör her zaman sıfır mıdır?',`<p><b>Hayır.</b> Vektörlerin kendileri sıfır olmak zorunda değil; <b>triple product sonucu 0</b> olur. Örn. a=(1,0,0), b=(0,1,0), c=(2,3,0): hepsi xy düzleminde. a×b=(0,0,1), bu da c ile dot yapılınca <b>0</b>.</p>`)}</div>`,

function svgLine(x1,y1,x2,y2,stroke,opacity=1,dash=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-opacity="${opacity}" stroke-width="1" ${dash?'stroke-dasharray="'+dash+'"':''}/>`}
function drawPlane(W,H,scale,cx,cy){let s='<defs><marker id="arrA" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7dd3fc"/></marker><marker id="arrB" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ffbf88"/></marker><marker id="arrS" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#b5f39f"/></marker></defs>';for(let x=cx%scale;x<=W;x+=scale)s+=svgLine(x,0,x,H,'#b9c5e1',.13);for(let y=cy%scale;y<=H;y+=scale)s+=svgLine(0,y,W,y,'#b9c5e1',.13);s+=`<line x1="0" y1="${cy}" x2="${W}" y2="${cy}" class="svg-axis"/><line x1="${cx}" y1="0" x2="${cx}" y2="${H}" class="svg-axis"/><circle cx="${cx}" cy="${cy}" r="3.3" fill="#fff"/><text x="${W-17}" y="${cy-9}" class="svg-label">x</text><text x="${cx+10}" y="18" class="svg-label">y</text>`;return s}
function vec(cx,cy,dx,dy,scale,color,marker,label,dashed=false){let xx=cx+dx*scale,yy=cy-dy*scale;return `<line x1="${cx}" y1="${cy}" x2="${xx}" y2="${yy}" stroke="${color}" stroke-width="${dashed?2:3.5}" stroke-linecap="round" ${dashed?'stroke-dasharray="5 7"':''} marker-end="url(#${marker})"/><text x="${xx+Math.sign(dx||1)*8}" y="${yy+(dy>=0?-10:19)}" fill="${color}" style="font:700 14px system-ui">${label}</text>`}
function drawVectorFor(suffix=''){const ids=id=>document.getElementById(id+suffix);if(!ids('ax'))return;const a=[+ids('ax').value,+ids('ay').value],b=[+ids('bx').value,+ids('by').value],s=[a[0]+b[0],a[1]+b[1]];const W=640,H=360,cx=320,cy=180,scale=22;let svg=drawPlane(W,H,scale,cx,cy);svg+=vec(cx,cy,a[0],a[1],scale,'#7dd3fc','arrA','a');svg+=vec(cx,cy,b[0],b[1],scale,'#ffbf88','arrB','b');svg+=vec(cx,cy,s[0],s[1],scale,'#b5f39f','arrS','a+b');svg+=`<line x1="${cx+a[0]*scale}" y1="${cy-a[1]*scale}" x2="${cx+s[0]*scale}" y2="${cy-s[1]*scale}" stroke="#ffbf88" stroke-width="1.8" stroke-opacity=".7" stroke-dasharray="6 6"/>`;ids('vectorSVG').innerHTML=svg;ids('vectorResult').innerHTML=`<strong style="color:#7dd3fc">a=(${a})</strong> &nbsp; + &nbsp; <strong style="color:#ffbf88">b=(${b})</strong> &nbsp; = &nbsp; <strong style="color:#b5f39f">(${s})</strong><br><span style="opacity:.8">Koordinatlar ayrı ayrı toplanır: ${a[0]} + (${b[0]}) = ${s[0]}; ${a[1]} + (${b[1]}) = ${s[1]}.</span>`}
function drawLI(){const ids=id=>document.getElementById(id);let a=[+ids('lax')?.value,+ids('lay')?.value],b=[+ids('lbx')?.value,+ids('lby')?.value];if(a.some(x=>!Number.isFinite(x))||b.some(x=>!Number.isFinite(x)))return;const det=a[0]*b[1]-a[1]*b[0],scale=Math.min(29,125/Math.max(2,...a.map(Math.abs),...b.map(Math.abs))),W=640,H=320,cx=320,cy=160;let svg=drawPlane(W,H,scale,cx,cy);svg+=vec(cx,cy,a[0],a[1],scale,'#7dd3fc','arrA','a');svg+=vec(cx,cy,b[0],b[1],scale,'#ffbf88','arrB','b');ids('liSVG').innerHTML=svg;ids('liResult').innerHTML=`a=(${a}), b=(${b})<br>det = (${a[0]}×${b[1]}) − (${a[1]}×${b[0]}) = <b>${det}</b><br><strong style="color:${det===0?'#ffbf88':'#b5f39f'}">${det===0?'LINEARLY DEPENDENT — aynı doğrultudalar (veya sıfır vektör var).':'LINEARLY INDEPENDENT — iki bağımsız yön var.'}</strong>`}
function drawSpan(){const mode=document.getElementById('spanMode')?.value;if(!mode)return;const c1=+document.getElementById('spanC1').value,c2=+document.getElementById('spanC2').value;const a=mode==='ind'?[1,0]:[1,1],b=mode==='ind'?[0,1]:[2,2],sum=[a[0]*c1+b[0]*c2,a[1]*c1+b[1]*c2];const scale=27,cx=320,cy=158;let svg=drawPlane(640,315,scale,cx,cy);let pts=[];for(let x=-3;x<=3;x++)for(let y=-3;y<=3;y++){let u=a[0]*x+b[0]*y,v=a[1]*x+b[1]*y;if(Math.abs(u)<=10&&Math.abs(v)<=5)pts.push(`<circle cx="${cx+u*scale}" cy="${cy-v*scale}" r="3.6" fill="#8b82ee" fill-opacity=".48"/>`)}svg+=pts.join('');svg+=vec(cx,cy,sum[0],sum[1],scale,'#b5f39f','arrS','v');document.getElementById('spanSVG').innerHTML=svg;document.getElementById('spanResult').innerHTML=`${c1}a + ${c2}b = <strong style="color:#b5f39f">(${sum})</strong>. ${mode==='ind'?'İki bağımsız yönle tüm düzleme gidebilirsin.':'Tüm sonuçlar y=x doğrusundadır; düzlemin tamamına ulaşamazsın.'}`}
function drawAngle(){const el=id=>document.getElementById(id);const parse=s=>s.split(',').map(x=>Number(x.trim()));const a=parse(el('angleA').value),b=parse(el('angleB').value);if(a.length!==2||b.length!==2||a.some(x=>!Number.isFinite(x))||b.some(x=>!Number.isFinite(x))){el('angleResult').textContent='Vektörleri virgülle ayırarak iki sayı yaz. Örn: 2,-1';return}let dot=a[0]*b[0]+a[1]*b[1],la=Math.hypot(...a),lb=Math.hypot(...b);if(la===0||lb===0){el('angleResult').textContent='Sıfır vektörüyle açı tanımlanmaz. Sıfırdan farklı vektörler kullan.';return}let cos=Math.max(-1,Math.min(1,dot/(la*lb))),degrees=Math.acos(cos)*180/Math.PI;el('angleResult').innerHTML=`a·b = ${a[0]}×${b[0]} + ${a[1]}×${b[1]} = <b>${dot.toFixed(3).replace(/\.000$/,'')}</b><br>|a| = ${la.toFixed(3)} &nbsp; |b| = ${lb.toFixed(3)}<br>cosθ = ${dot.toFixed(3)}/(${la.toFixed(3)}×${lb.toFixed(3)}) = ${cos.toFixed(4)}<br><strong style="color:#b5f39f">θ = arccos(${cos.toFixed(4)}) ≈ ${degrees.toFixed(2)}°</strong>`}

// Linear combination: geometrik iki-adım gösterimi; gözlenen sonuç c1 a + c2 b.
function drawDeepCombination(){const svg=document.getElementById('comboLive');if(!svg)return;let mode=document.getElementById('comboMode').value,c1=+document.getElementById('comboC1').value,c2=+document.getElementById('comboC2').value;document.getElementById('comboC1V').textContent=c1;document.getElementById('comboC2V').textContent=c2;const a=[2,1],b=mode==='ind'?[-1,2]:[4,2],sa=a.map(v=>v*c1),sb=b.map(v=>v*c2),sum=[sa[0]+sb[0],sa[1]+sb[1]],absMax=Math.max(6,Math.abs(sa[0]),Math.abs(sa[1]),Math.abs(sb[0]),Math.abs(sb[1]),Math.abs(sum[0]),Math.abs(sum[1])),sc=Math.min(23,122/absMax),cx=320,cy=165;
let s=`<defs><marker id="dcA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#7dd3fc"/></marker><marker id="dcB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#ffbf88"/></marker><marker id="dcS" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#b5f39f"/></marker></defs>`;
for(let d=-12;d<=12;d++) {let x=cx+d*sc,y=cy+d*sc;if(x>=0&&x<=640)s+=`<line x1="${x}" y1="0" x2="${x}" y2="330" stroke="#d6e4ff" stroke-opacity=".07"/>`;if(y>=0&&y<=330)s+=`<line x1="0" y1="${y}" x2="640" y2="${y}" stroke="#d6e4ff" stroke-opacity=".07"/>`}
s+=`<line x1="0" y1="${cy}" x2="640" y2="${cy}" stroke="#6a82a7" opacity=".8"/><line x1="${cx}" y1="0" x2="${cx}" y2="330" stroke="#6a82a7" opacity=".8"/>`;
const pt=v=>[cx+v[0]*sc,cy-v[1]*sc];const appendArrow=(st,en,marker,col,label)=>{let p=pt(st),q=pt(en);if(Math.hypot(q[0]-p[0],q[1]-p[1])<2)return; s+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${col}" stroke-width="4" stroke-linecap="round" marker-end="url(#${marker})"/><text x="${q[0]+10}" y="${q[1]-9}" font-size="12" fill="${col}" font-weight="700">${label}</text>`};
appendArrow([0,0],sa,'dcA','#7dd3fc','c₁a');appendArrow(sa,sum,'dcB','#ffbf88','c₂b');appendArrow([0,0],sum,'dcS','#b5f39f','toplam');svg.innerHTML=s;
const det=a[0]*b[1]-a[1]*b[0];document.getElementById('comboLiveResult').innerHTML=`${c1}a+${c2}b = ${c1}(${a}) + ${c2}(${b}) = <strong>(${sum[0]}, ${sum[1]})</strong><br>${mode==='ind'?'İki bağımsız yön: det = '+det+' ≠0 → tüm R² elde edilebilir.':'b=2a olduğundan her toplam aynı doğru üzerinde: (2t,t). det=0 → yalnızca doğru span edilir.'}`;}
